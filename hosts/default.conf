# Defaults for any machine without its own hosts/<hostname>.conf
# Sourced by scripts/lib/host.sh, so keep it to plain KEY="value" lines

# Space-separated package roles from packages/<role>.txt
ROLES="common desktop"

# Output that needs a custom CRT mode, left empty when there is no CRT
CRT_OUTPUT=""
CRT_MODE_NAME=""
CRT_MODELINE=""

# "yes" turns Wi-Fi off outside the tty1 X session (wired headless hosts)
WIFI_ONLY_IN_X_SESSION="no"
